<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" fill="none">
  <!-- Black Background Banner -->
  <rect width="1000" height="280" rx="8" fill="#000000" />

  <!-- Thick Red Outer Circle Ring -->
  <circle cx="135" cy="140" r="102" stroke="#E60000" stroke-width="16" fill="#000000" />

  <!-- White Hookah Silhouette Inside Circle -->
  <g fill="#FFFFFF">
    <!-- Top Bowl (Chilam) -->
    <path d="M108 62 C117 67 129 67 138 62 L134 80 C131 86 115 86 112 80 Z" />
    <!-- Neck Below Bowl -->
    <rect x="119" y="80" width="8" height="10" rx="2" />
    <!-- Ash Tray / Plate -->
    <path d="M104 90 H142 L134 97 H112 Z" />
    <!-- Upper Stem Bulb -->
    <ellipse cx="123" cy="107" rx="10" ry="8" />
    <!-- Middle Stem Body (Behind Hose) -->
    <path d="M113 114 C113 114 138 118 138 134 C138 142 131 146 123 146 C113 146 107 140 107 131 Z" />
    <!-- Lower Stem / Heart -->
    <ellipse cx="123" cy="157" rx="14" ry="9" />
    <!-- Bell Base (Pot) -->
    <path d="M111 163 H135 C144 176 155 190 154 205 C153 213 146 216 123 216 C100 216 93 213 92 205 C91 190 102 176 111 163 Z" />
  </g>

  <!-- Curved S-Loop Hose with Black Stroke Separation and White Inner Core -->
  <path
    d="M132 122 C152 108 175 104 179 128 C183 152 162 158 143 146 C125 135 106 118 89 121 C74 124 75 142 80 156"
    stroke="#000000"
    stroke-width="16"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M132 122 C152 108 175 104 179 128 C183 152 162 158 143 146 C125 135 106 118 89 121 C74 124 75 142 80 156"
    stroke="#FFFFFF"
    stroke-width="7.5"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Hose Mouthpiece Tip (Left) -->
  <polygon points="75,152 84,151 83,167" fill="#FFFFFF" />

  <!-- Bold Serif Typography using single <text> with <tspan> so SHISHA and RENT never overlap or clip -->
  <text
    x="265"
    y="170"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="800"
    font-size="82"
    letter-spacing="2"
  >
    <tspan fill="#FFFFFF">SHISHA </tspan>
    <tspan fill="#E60000" dx="12">RENT</tspan>
  </text>
</svg>
